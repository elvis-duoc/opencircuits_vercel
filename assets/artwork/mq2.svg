<svg class="cgfx__sensor-gas-module" xmlns="http://www.w3.org/2000/svg" viewBox="-32 0 64 122" width="64" height="122" style="fill: rgb(0, 0, 0); stroke: none; font-family: Arial, Helvetica, sans-serif;">
 <defs>
  <linearGradient id="__PREFIX__pin" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8d939b"/><stop offset=".45" stop-color="#f2f4f6"/><stop offset="1" stop-color="#7d838b"/></linearGradient>
  <linearGradient id="__PREFIX__pcb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2463b8"/><stop offset="1" stop-color="#173f80"/></linearGradient>
  <radialGradient id="__PREFIX__ring" cx=".4" cy=".35" r=".75"><stop offset="0" stop-color="#f4f6f8"/><stop offset=".55" stop-color="#c3c9cf"/><stop offset="1" stop-color="#7f878f"/></radialGradient>
  <radialGradient id="__PREFIX__cap" cx=".4" cy=".35" r=".8"><stop offset="0" stop-color="#e3e7eb"/><stop offset=".6" stop-color="#a9b0b7"/><stop offset="1" stop-color="#6f777f"/></radialGradient>
  <pattern id="__PREFIX__mesh" width="2.2" height="2.2" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0,1.1H2.2M1.1,0V2.2" stroke="#5f666d" stroke-width=".45" opacity=".75"/></pattern>
  <radialGradient id="__PREFIX__smoke" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#8a8f95" stop-opacity=".9"/><stop offset="1" stop-color="#8a8f95" stop-opacity="0"/></radialGradient>
 </defs>
 <g class="cgfx__wireview">
  <!-- Output header: VCC, GND, DO and AO at 2.54 mm, pointing down -->
  <g>
   <rect x="-16.2" y="98" width="2.4" height="24" rx=".6" fill="url(#__PREFIX__pin)"/>
   <rect x="-6.2" y="98" width="2.4" height="24" rx=".6" fill="url(#__PREFIX__pin)"/>
   <rect x="3.8" y="98" width="2.4" height="24" rx=".6" fill="url(#__PREFIX__pin)"/>
   <rect x="13.8" y="98" width="2.4" height="24" rx=".6" fill="url(#__PREFIX__pin)"/>
  </g>
  <!-- Blue Flying-Fish board with four mounting holes -->
  <rect x="-31" y="2" width="62" height="94" rx="2" fill="url(#__PREFIX__pcb)" stroke="#123266" stroke-width=".6"/>
  <g fill="#d6dce2"><circle cx="-24" cy="9" r="4.4"/><circle cx="24" cy="9" r="4.4"/><circle cx="-24" cy="84" r="4.4"/><circle cx="24" cy="84" r="4.4"/></g>
  <g fill="#f4f5f6"><circle cx="-24" cy="9" r="3.2"/><circle cx="24" cy="9" r="3.2"/><circle cx="-24" cy="84" r="3.2"/><circle cx="24" cy="84" r="3.2"/></g>
  <!-- Copper outline around the sensor -->
  <rect x="-26" y="15" width="52" height="52" rx="4" fill="none" stroke="#3f7fd0" stroke-width=".6" opacity=".8"/>
  <!-- MQ-2 sensor: steel ring and the stainless mesh cap -->
  <circle cx="0" cy="41" r="24.5" fill="#2a3d5a" opacity=".45"/>
  <circle cx="0" cy="40" r="24" fill="url(#__PREFIX__ring)" stroke="#6b737b" stroke-width=".6"/>
  <circle cx="0" cy="40" r="20.5" fill="#9aa1a8"/>
  <circle cx="0" cy="40" r="19.5" fill="url(#__PREFIX__cap)"/>
  <circle cx="0" cy="40" r="19.5" fill="url(#__PREFIX__mesh)"/>
  <ellipse cx="-6" cy="31" rx="8" ry="5" fill="#ffffff" opacity=".35"/>
  <!-- Indicator LEDs: power (left) and DOUT, lit while the gas is over the threshold (right) -->
  <rect x="-25" y="68" width="6" height="8" rx=".6" fill="#e9edf1"/><rect x="-23.8" y="69.6" width="3.6" height="4.8" rx=".5" fill="#5a2a2a" class="cgfx__powerled"/>
  <rect x="19" y="68" width="6" height="8" rx=".6" fill="#e9edf1"/><rect x="20.2" y="69.6" width="3.6" height="4.8" rx=".5" fill="#2f5a3a" class="cgfx__ledsignal"/>
  <g fill="#f4f4f4" font-weight="700">
   <text x="0" y="75" font-size="6" text-anchor="middle" font-style="italic">Flying-Fish</text>
   <text x="-22" y="66.5" font-size="2.6" text-anchor="middle">PWR</text><text x="22" y="66.5" font-size="2.6" text-anchor="middle">DOUT</text>
   <text x="-15" y="91" font-size="3.4" text-anchor="middle">VCC</text><text x="-5" y="91" font-size="3.4" text-anchor="middle">GND</text>
   <text x="5" y="91" font-size="3.4" text-anchor="middle">DO</text><text x="15" y="91" font-size="3.4" text-anchor="middle">AO</text>
  </g>
  <rect x="-20" y="93" width="40" height="7" rx="1" fill="#1a1a1a"/>
  <rect x="-20" y="93" width="40" height="1.6" rx=".8" fill="#3a3a3a"/>
  <!-- Smoke around the sensor: its opacity follows the gas level during the simulation -->
  <g class="cgfx__smoke" opacity="0" pointer-events="none">
   <circle cx="-12" cy="22" r="14" fill="url(#__PREFIX__smoke)"/><circle cx="10" cy="16" r="16" fill="url(#__PREFIX__smoke)"/>
   <circle cx="0" cy="34" r="18" fill="url(#__PREFIX__smoke)"/><circle cx="16" cy="40" r="12" fill="url(#__PREFIX__smoke)"/>
  </g>
  <path class="cgfx__hitarea" style="fill: rgb(255, 0, 0); display: inline; opacity: 0; pointer-events: all;" d="M-31,2h62v98h-62z"/>
  <path class="cgfx__selected" display="none" fill="none" stroke="#009cda" stroke-width="2" stroke-linejoin="round" d="M-33,0h66v102h-66z" style="display: none; pointer-events: none;"/>
 </g>
</svg>
